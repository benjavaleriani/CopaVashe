<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Copa Vashe</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#E9EDF2; --surface:#FFFFFF; --surface2:#F3F5F8; --ink:#17203A; --muted:#5B6479;
  --line:#D5DBE4; --gold:#D79A1E; --gold-soft:#FBEFD3; --pitch:#2C6B4C; --pitch-soft:#DCEDE3;
  --loss:#B8403A; --focus:#2F5BD3;
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#10162A; --surface:#1A2238; --surface2:#222C46; --ink:#E7EBF3; --muted:#9AA4BA;
    --line:#2E3A57; --gold:#F0B53B; --gold-soft:#3A3020; --pitch:#5FBF8D; --pitch-soft:#1D3A2E;
    --loss:#E2736C; --focus:#8DA9FF; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#10162A; --surface:#1A2238; --surface2:#222C46; --ink:#E7EBF3; --muted:#9AA4BA;
  --line:#2E3A57; --gold:#F0B53B; --gold-soft:#3A3020; --pitch:#5FBF8D; --pitch-soft:#1D3A2E;
  --loss:#E2736C; --focus:#8DA9FF; color-scheme:dark;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Archivo",system-ui,-apple-system,"Segoe UI",sans-serif;font-variation-settings:"wdth" 100;font-size:16px;line-height:1.45}
button,input,select{font:inherit;color:inherit}
a{color:inherit}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.wrap{max-width:980px;margin:0 auto;padding:0 16px 48px}

.bar{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 0;border-bottom:1px solid var(--line);flex-wrap:wrap}
.bar .logo{font-weight:900;font-variation-settings:"wdth" 62;font-size:1.5rem;text-decoration:none;text-transform:uppercase;letter-spacing:.01em}
.bar nav{display:flex;gap:4px}
.bar nav a{padding:8px 12px;border-radius:8px;text-decoration:none;font-weight:700;color:var(--muted)}
.bar nav a[aria-current=page]{color:var(--ink);background:var(--surface)}

header.hero{padding:26px 0 6px;display:flex;flex-wrap:wrap;align-items:flex-end;gap:16px;justify-content:space-between}
.hero h1{margin:0;font-weight:900;font-variation-settings:"wdth" 62;font-size:clamp(2.8rem,9vw,5rem);line-height:.88;letter-spacing:-.01em;text-transform:uppercase}
.hero p{margin:6px 0 0;color:var(--muted);font-size:.95rem}
.ed-pick{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
select,input[type=text],input[type=date]{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 10px;min-height:40px}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 14px;min-height:40px;cursor:pointer;font-weight:600;text-decoration:none;display:inline-flex;align-items:center}
.btn:hover{background:var(--surface2)}
.btn.primary{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.btn.primary:hover{opacity:.9}
.btn.danger{color:var(--loss)}
.btn.small{min-height:32px;padding:4px 10px;font-size:.88rem}

nav.tabs{display:flex;gap:4px;overflow-x:auto;border-bottom:2px solid var(--line);margin:16px 0 20px;scrollbar-width:none}
nav.tabs a{padding:10px 14px;text-decoration:none;color:var(--muted);font-weight:700;white-space:nowrap;border-bottom:3px solid transparent;margin-bottom:-2px}
nav.tabs a[aria-current=page]{color:var(--ink);border-color:var(--gold)}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:16px}
h2{font-variation-settings:"wdth" 75;font-weight:800;font-size:1.55rem;margin:0 0 12px;line-height:1.1}
h3{font-size:1rem;margin:0 0 8px;font-weight:800}
.muted{color:var(--muted)}
.scroll{overflow-x:auto}

table.t{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
.t th{font-size:.8rem;color:var(--muted);font-weight:600;text-align:center;padding:6px 6px;border-bottom:1px solid var(--line);white-space:nowrap}
.t th.l,.t td.l{text-align:left}
.t td{padding:9px 6px;text-align:center;border-bottom:1px solid var(--line)}
.t tr:last-child td{border-bottom:0}
.t td.pts{font-weight:900;font-size:1.05rem}
.t tr.q td:first-child{box-shadow:inset 4px 0 0 var(--pitch)}
.pos{font-weight:800;width:32px}
.who{display:flex;align-items:center;gap:10px;min-width:150px;text-decoration:none}
a.who:hover b{text-decoration:underline}
.who b{display:block;line-height:1.15}
.who small{color:var(--muted);display:block;font-size:.8rem}

.badge{width:32px;height:32px;border-radius:50%;flex:none;display:grid;place-items:center;font-weight:900;font-size:.62rem;letter-spacing:.02em;font-variation-settings:"wdth" 75;border:1px solid var(--line);overflow:hidden;background:var(--surface2)}
.badge.img{border-radius:6px;border:0;background:transparent}
.badge img{width:100%;height:100%;object-fit:contain}
.badge.lg{width:56px;height:56px;font-size:.9rem}
.badge.xl{width:84px;height:84px;font-size:1.1rem}

.champ{display:flex;align-items:center;gap:16px;background:var(--gold-soft);border:2px solid var(--gold);border-radius:14px;padding:16px 18px;margin-bottom:16px}
.champ .cup{font-size:2.6rem;line-height:1}
.champ .lbl{font-size:.85rem;color:var(--muted)}
.champ .nm{font-weight:900;font-variation-settings:"wdth" 70;font-size:clamp(1.6rem,5vw,2.4rem);line-height:1;text-transform:uppercase}

.round{margin-bottom:16px}
.round h3{color:var(--muted);font-size:.85rem;font-weight:700}
.match{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.match:last-child{border-bottom:0}
.match .side{display:flex;align-items:center;gap:8px;min-width:0}
.match .side.away{justify-content:flex-end;text-align:right}
.match .side span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600}
.match .side.win span{font-weight:900}
.score{display:flex;align-items:center;gap:6px}
.score input{width:46px;height:40px;text-align:center;font-weight:800;font-size:1.1rem;border:1px solid var(--line);border-radius:8px;background:var(--surface2);-moz-appearance:textfield}
.score input::-webkit-outer-spin-button,.score input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.pens{grid-column:1/-1;display:flex;justify-content:center;align-items:center;gap:6px;font-size:.85rem;color:var(--muted)}
.pens input{width:40px;height:32px;text-align:center;border:1px solid var(--line);border-radius:6px;background:var(--surface2)}

.bracket{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media (max-width:680px){.bracket{grid-template-columns:1fr}}
.ko{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 16px}
.ko.final{border:2px solid var(--gold)}
.ko .tag{font-size:.82rem;color:var(--muted);font-weight:700}
.tbd{color:var(--muted);font-style:italic;padding:10px 0}

.bk{display:grid;grid-template-columns:minmax(0,1fr) 44px minmax(0,1fr) 44px minmax(0,.85fr);grid-template-rows:1fr 1fr;row-gap:28px;align-items:center;margin:8px 0 28px}
.bk .sf1{grid-column:1;grid-row:1}.bk .sf2{grid-column:1;grid-row:2}
.bk .c1{grid-column:2;grid-row:1/3;align-self:stretch;position:relative}
.bk .fin{grid-column:3;grid-row:1/3}
.bk .c2{grid-column:4;grid-row:1/3;align-self:stretch;position:relative}
.bk .ch{grid-column:5;grid-row:1/3}
.c1::before{content:"";position:absolute;left:0;right:50%;top:25%;bottom:25%;border:2px solid var(--line);border-left:0;border-radius:0 12px 12px 0}
.c1::after,.c2::after{content:"";position:absolute;left:50%;right:0;top:50%;border-top:2px solid var(--line)}
.c2::after{left:0}
.c1.on::before,.c1.on::after,.c2.on::after{border-color:var(--gold)}
.bm{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.bm.big{border:2px solid var(--gold)}
.bm-h{display:flex;justify-content:space-between;gap:8px;padding:8px 12px;font-size:.78rem;font-weight:700;color:var(--muted);background:var(--surface2)}
.bm-row{display:flex;align-items:center;gap:10px;padding:10px 12px;border-top:1px solid var(--line);min-height:56px;position:relative}
.bm-row .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:700;text-decoration:none}
.bm-row .seed{width:26px;font-size:.78rem;color:var(--muted);font-weight:700;flex:none}
.bm-row.won{background:var(--gold-soft)}
.bm-row.won::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--gold)}
.bm-row.won .nm{font-weight:900}
.bm-row.lost .nm{color:var(--muted);font-weight:500}
.bm-row .sc{width:44px;height:38px;text-align:center;font-weight:900;font-size:1.1rem;border:1px solid var(--line);border-radius:8px;background:var(--surface2);-moz-appearance:textfield;flex:none}
.bm-row .pk{width:34px;height:30px;text-align:center;font-size:.85rem;font-weight:700;border:1px dashed var(--line);border-radius:6px;background:transparent;-moz-appearance:textfield;flex:none}
.bm-row input::-webkit-outer-spin-button,.bm-row input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.bm-row.tbd .nm{color:var(--muted);font-weight:500;font-style:italic}
.chbox{text-align:center;padding:20px 14px;border-radius:16px;border:2px dashed var(--line);display:flex;flex-direction:column;align-items:center;gap:8px}
.chbox.done{border:2px solid var(--gold);background:var(--gold-soft)}
.chbox .tr{font-size:2.4rem;line-height:1}
.chbox .nm{font-weight:900;font-variation-settings:"wdth" 70;font-size:1.6rem;line-height:1;text-transform:uppercase}
.third{max-width:420px}
.ggrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,420px),1fr));gap:16px}
.ggrid .panel{margin:0}
.bk8{display:grid;grid-template-columns:minmax(0,1fr) 30px minmax(0,1fr) 30px minmax(0,1fr) 30px minmax(0,.8fr);grid-template-rows:repeat(4,auto);align-items:center;margin:8px 0 28px;width:min(calc(100vw - 32px),1320px);position:relative;left:50%;transform:translateX(-50%)}
.bk8>.q,.bk8>.s,.bk8>.f,.bk8>.chc{padding:9px 0}
.bk8 .q1{grid-column:1;grid-row:1}.bk8 .q3{grid-column:1;grid-row:2}.bk8 .q2{grid-column:1;grid-row:3}.bk8 .q4{grid-column:1;grid-row:4}
.bk8 .ca{grid-column:2;grid-row:1/3}.bk8 .cb{grid-column:2;grid-row:3/5}
.bk8 .s1{grid-column:3;grid-row:1/3}.bk8 .s2{grid-column:3;grid-row:3/5}
.bk8 .cc{grid-column:4;grid-row:1/5}.bk8 .f{grid-column:5;grid-row:1/5}.bk8 .cd{grid-column:6;grid-row:1/5}.bk8 .chc{grid-column:7;grid-row:1/5}
.bk8 .c1,.bk8 .c2{align-self:stretch;position:relative}
.bk8 .bm-row{gap:7px;padding:8px 10px;min-height:50px}
.bk8 .bm-row .badge{width:26px;height:26px}
.ghead{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:6px}
.pick.g{grid-template-columns:auto 1fr auto 1fr}
@media (max-width:900px){
  .bk8{grid-template-columns:1fr;grid-template-rows:none;width:auto;left:auto;transform:none}
  .bk8>*{grid-column:1!important;grid-row:auto!important}
  .bk8 .c1,.bk8 .c2{display:none}
  .bk8>.q,.bk8>.s,.bk8>.f,.bk8>.chc{padding:7px 0}
}
@media (max-width:760px){
  .bk{grid-template-columns:1fr;grid-template-rows:none;row-gap:14px}
  .bk>*{grid-column:1!important;grid-row:auto!important}
  .bk .c1,.bk .c2{display:none}
}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px}
.grid.sm{grid-template-columns:repeat(auto-fill,minmax(170px,1fr))}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:10px}
a.card{text-decoration:none}
a.card:hover{border-color:var(--ink)}
.cupcard{padding:20px;gap:6px;min-height:150px;justify-content:space-between}
.cupcard .nm{font-weight:900;font-variation-settings:"wdth" 65;font-size:2rem;line-height:.95;text-transform:uppercase}
.cupwrap{position:relative;display:flex}
.cupwrap>.cupcard{flex:1}
.cupdel{position:absolute;top:10px;right:10px;width:28px;height:28px;border-radius:50%;border:1px solid var(--line);background:var(--surface);color:var(--loss);font-size:.8rem;font-weight:800;line-height:1;cursor:pointer;opacity:0;transition:opacity .15s}
.cupwrap:hover .cupdel,.cupdel:focus-visible{opacity:1}
.cupdel:hover{background:var(--loss);color:#fff;border-color:var(--loss)}
@media (hover:none){.cupdel{opacity:1}}
.cupcard.new{border-style:dashed;align-items:center;justify-content:center;color:var(--muted);font-weight:700;cursor:pointer;background:transparent}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.empty{text-align:center;padding:40px 16px}
.empty p{color:var(--muted);max-width:42ch;margin:8px auto 18px}
.note{font-size:.85rem;color:var(--muted);margin:0 0 12px}
.status{font-size:.82rem;color:var(--muted);min-height:1.2em}
.crumb{font-size:.9rem;color:var(--muted);text-decoration:none;font-weight:600}
.crumb:hover{color:var(--ink)}

.stats{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:10px}
.stat{background:var(--surface2);border-radius:10px;padding:12px}
.stat .v{font-weight:900;font-size:1.7rem;font-variation-settings:"wdth" 75;line-height:1}
.stat .k{font-size:.8rem;color:var(--muted);margin-top:4px}
.stat.gold{background:var(--gold-soft)}
.recs{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:10px}
.rec{border:1px solid var(--line);border-radius:10px;padding:12px}
.rec .k{font-size:.82rem;color:var(--muted);font-weight:600}
.rec .v{font-weight:800;font-size:1.1rem;margin:2px 0}
.rec small{color:var(--muted)}
.res{font-weight:700;white-space:nowrap}
.res.c{color:var(--gold)}
.form{display:inline-flex;gap:3px}
.form i{width:20px;height:20px;border-radius:4px;display:grid;place-items:center;font-style:normal;font-size:.7rem;font-weight:800;color:#fff}
.form .W{background:var(--pitch)} .form .D{background:var(--muted)} .form .L{background:var(--loss)}

dialog{border:1px solid var(--line);border-radius:14px;background:var(--surface);color:var(--ink);padding:0;width:min(580px,94vw);max-height:90vh}
dialog::backdrop{background:rgba(10,14,28,.55)}
.dlg{padding:20px;display:flex;flex-direction:column;gap:14px;overflow:auto;max-height:90vh}
.dlg label{display:flex;flex-direction:column;gap:4px;font-weight:600;font-size:.9rem}
.pick{display:grid;grid-template-columns:auto 1fr 1fr;gap:8px;align-items:center}
.pick input[type=checkbox]{width:20px;height:20px}
.err{color:var(--loss);font-size:.88rem;min-height:1.2em}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg label{flex-direction:row;align-items:center;gap:6px;font-weight:500}

/* ===== Tema mundial de clubes: negro + dorado ===== */
:root, :root:not([data-theme="light"]), :root[data-theme="dark"], :root[data-theme="light"]{
  --bg:#000000; --surface:#0C0C0C; --surface2:#171717; --ink:#FFFFFF; --muted:#9C978C;
  --line:#2B2720; --gold:#E3B55E; --gold2:#F7DC97; --gold3:#A97A2A; --gold-soft:rgba(227,181,94,.12);
  --pitch:#E3B55E; --pitch-soft:rgba(227,181,94,.12); --loss:#E25A4E; --focus:#F7DC97;
  --goldgrad:linear-gradient(135deg,#F7DC97 0%,#E3B55E 45%,#A97A2A 100%);
  color-scheme:dark;
}
body{background:#000;overflow-x:hidden}
body::after{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;
  background:
    repeating-radial-gradient(circle at 112% 18%, transparent 0 22px, rgba(227,181,94,.55) 23px 24px, transparent 25px 34px),
    repeating-radial-gradient(circle at -14% 92%, transparent 0 22px, rgba(227,181,94,.45) 23px 24px, transparent 25px 34px);
  -webkit-mask-image:radial-gradient(ellipse 48% 60% at 100% 20%, #000 0, transparent 75%),radial-gradient(ellipse 45% 55% at 0% 95%, #000 0, transparent 75%);
  mask-image:radial-gradient(ellipse 48% 60% at 100% 20%, #000 0, transparent 75%),radial-gradient(ellipse 45% 55% at 0% 95%, #000 0, transparent 75%);
  opacity:.85}
.wrap{position:relative}
.match{max-width:760px;margin:0 auto}

.bar{border-bottom:1px solid var(--line)}
.bar .logo{font-size:1.6rem;background:var(--goldgrad);-webkit-background-clip:text;background-clip:text;color:transparent}
.bar nav a{border-radius:999px;text-transform:uppercase;font-size:.85rem;letter-spacing:.04em}
.bar nav a[aria-current=page]{color:#000;background:var(--goldgrad)}

.hero h1{color:#fff;font-size:clamp(3rem,10vw,5.6rem);text-shadow:0 2px 30px rgba(227,181,94,.15)}
.hero p{color:var(--gold);font-weight:800;text-transform:uppercase;letter-spacing:.06em;font-size:.9rem}
.crumb{color:var(--muted)}
.crumb:hover{color:var(--gold2)}

select,input[type=text],input[type=date]{background:#0F0F0F;border-color:var(--line);color:#fff}
.btn{background:#111;border-color:var(--line);color:#fff;border-radius:999px;font-weight:700}
.btn:hover{background:#1A1A1A;border-color:var(--gold3)}
.btn.primary{background:var(--goldgrad);color:#000;border-color:transparent}
.btn.primary:hover{opacity:1;filter:brightness(1.08)}
.btn.danger{color:var(--loss)}

nav.tabs{border-bottom:1px solid var(--line)}
nav.tabs a{text-transform:uppercase;font-size:.88rem;letter-spacing:.05em}
nav.tabs a[aria-current=page]{color:var(--gold2);border-color:var(--gold)}

.panel,.card,.ko,.bm,.rec{background:linear-gradient(180deg,#0E0E0E,#070707);border:1px solid rgba(227,181,94,.22);box-shadow:inset 0 0 28px rgba(227,181,94,.05),0 0 0 1px rgba(0,0,0,.6)}
.panel{border-radius:14px}
h2{font-variation-settings:"wdth" 65;font-weight:900;text-transform:uppercase;font-size:1.7rem;letter-spacing:.01em}
h3{text-transform:uppercase;letter-spacing:.04em;font-size:.9rem;color:var(--gold)}
.round h3{color:var(--gold)}

.t th{color:var(--gold);text-transform:uppercase;letter-spacing:.05em;font-size:.72rem;border-bottom-color:rgba(227,181,94,.3)}
.t td{border-bottom-color:#1D1B17}
.t td.pts{color:var(--gold2)}
.t tr.q td:first-child{box-shadow:inset 3px 0 0 var(--gold)}
.t tbody tr:hover td{background:rgba(227,181,94,.04)}
.who b{text-transform:uppercase;font-variation-settings:"wdth" 80;letter-spacing:.01em}

/* scorebug */
.match{border-bottom:0;padding:5px 0;gap:0;grid-template-columns:1fr auto 1fr}
.match .side{background:#000;border:1px solid #232019;padding:8px 12px;min-height:46px}
.match .side:not(.away){border-radius:8px 0 0 8px;border-right:0}
.match .side.away{border-radius:0 8px 8px 0;border-left:0}
.match .side span{text-transform:uppercase;font-variation-settings:"wdth" 70;font-weight:800;font-size:1.05rem;letter-spacing:.02em}
.match .side.win{box-shadow:inset 0 -3px 0 var(--gold)}
.score{background:#000;border-top:1px solid #232019;border-bottom:1px solid #232019;align-self:stretch;padding:0 6px;gap:4px}
.score .muted{display:none}
.score input,.bm-row .sc{background:#fff;color:#000;border:0;border-radius:4px;font-variation-settings:"wdth" 75;font-weight:900;font-size:1.25rem;width:42px;height:36px;align-self:center}
.score input:focus-visible,.bm-row .sc:focus-visible{outline:2px solid var(--gold2)}
.pens{color:var(--gold);text-transform:uppercase;font-size:.75rem;letter-spacing:.05em;margin-top:4px}
.pens input,.bm-row .pk{background:#111;color:var(--gold2);border:1px solid var(--gold3)}

/* bracket */
.bm{border-radius:10px}
.bm.big{border:1px solid var(--gold);box-shadow:0 0 0 1px rgba(227,181,94,.35),0 0 30px rgba(227,181,94,.18)}
.bm-h{background:#000;color:var(--gold);text-transform:uppercase;letter-spacing:.06em;font-size:.7rem;border-bottom:1px solid rgba(227,181,94,.2)}
.bm-row{border-top-color:#1D1B17}
.bm-row .nm{text-transform:uppercase;font-variation-settings:"wdth" 75}
.bm-row .seed{color:var(--gold)}
.bm-row.won{background:linear-gradient(90deg,rgba(227,181,94,.18),rgba(227,181,94,0))}
.bm-row.won::before{background:var(--goldgrad)}
.c1::before,.c1::after,.c2::after{border-color:#3A342A}
.c1.on::before,.c1.on::after,.c2.on::after{border-color:var(--gold)}
.chbox{border:1px dashed rgba(227,181,94,.35);background:radial-gradient(circle at 50% 30%,rgba(227,181,94,.08),transparent 70%)}
.chbox.done{border:1px solid var(--gold);background:radial-gradient(circle at 50% 30%,rgba(247,220,151,.22),rgba(0,0,0,.2) 75%);box-shadow:0 0 40px rgba(227,181,94,.25)}
.chbox .nm{background:var(--goldgrad);-webkit-background-clip:text;background-clip:text;color:transparent}

.champ{background:radial-gradient(ellipse at 20% 50%,rgba(247,220,151,.18),rgba(0,0,0,.6) 70%);border:1px solid var(--gold);box-shadow:0 0 40px rgba(227,181,94,.18)}
.champ .nm{background:var(--goldgrad);-webkit-background-clip:text;background-clip:text;color:transparent}

/* inicio y tarjetas */
.cupcard .nm{color:#fff}
a.card:hover,.cupwrap:hover .cupcard{border-color:var(--gold);box-shadow:inset 0 0 30px rgba(227,181,94,.1),0 0 24px rgba(227,181,94,.12)}
.cupcard.new{border:1px dashed rgba(227,181,94,.4);color:var(--gold)}
.cupdel{background:#000;border-color:var(--line)}
.grid.sm .card{background:#050505;border-color:rgba(227,181,94,.2)}
.grid.sm .card b{text-transform:uppercase;font-size:.85rem;letter-spacing:.03em}

.stat{background:#0B0B0B;border:1px solid #1F1C17}
.stat .v{color:#fff}
.stat .k{text-transform:uppercase;letter-spacing:.05em;font-size:.7rem}
.stat.gold{background:var(--goldgrad);border:0}
.stat.gold .v,.stat.gold .k{color:#000}
.rec .k{color:var(--gold);text-transform:uppercase;letter-spacing:.05em;font-size:.72rem}
.res.c{color:var(--gold2)}
.form .W{background:#2B7349;color:#E8F2EC}
.form .D{background:#B39532;color:#1A1608}
.form .L{background:#A6463E;color:#F6E7E5}

dialog{background:#0A0A0A;border:1px solid rgba(227,181,94,.35);color:#fff}
dialog::backdrop{background:rgba(0,0,0,.75)}
dialog.wide{width:min(820px,95vw)}
.bar .rt{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
#adminBtn.on{border-color:var(--gold);color:var(--gold2)}
textarea{background:#0F0F0F;border:1px solid var(--line);color:#fff;border-radius:8px;padding:10px;min-height:110px;width:100%;resize:vertical;font:inherit}
.ro .match input,.ro .bm-row input{pointer-events:none}
.news{display:flex;flex-direction:column;gap:14px}
.nw{padding:18px}
.nw .d{color:var(--gold);text-transform:uppercase;letter-spacing:.06em;font-size:.75rem;font-weight:800}
.nw .t{font-weight:900;font-variation-settings:"wdth" 70;text-transform:uppercase;font-size:1.5rem;line-height:1.1;margin:6px 0 8px}
.nw .b{white-space:pre-wrap;color:#D8D4CA;overflow-wrap:anywhere}
[data-open]{cursor:pointer}
.match[data-open]:hover .side,.match[data-open]:hover .score{border-color:rgba(227,181,94,.55)}
.bm[data-open]:hover{border-color:var(--gold)}
.bigm{display:flex;flex-direction:column;gap:18px}
.bigm-h{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;color:var(--gold);text-transform:uppercase;letter-spacing:.06em;font-size:.78rem;font-weight:800;border-bottom:1px solid rgba(227,181,94,.25);padding-bottom:12px}
.bigm-main{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:16px;padding:18px 0;background:radial-gradient(ellipse at 50% 50%,rgba(227,181,94,.1),transparent 70%)}
.bigm-side{display:flex;flex-direction:column;align-items:center;text-align:center;gap:8px;min-width:0}
.badge.xxl{width:120px;height:120px;font-size:1.4rem}
.bigm-nm{font-weight:900;font-variation-settings:"wdth" 65;text-transform:uppercase;font-size:clamp(1.3rem,4vw,2rem);line-height:1;text-decoration:none;color:#fff;overflow-wrap:anywhere}
.bigm-side.won .bigm-nm{background:var(--goldgrad);-webkit-background-clip:text;background-clip:text;color:transparent}
.bigm-side.lost{opacity:.6}
.bigm-cl{color:var(--muted);font-size:.85rem}
.bigm-mid{display:flex;flex-direction:column;align-items:center;gap:8px}
.bigm-score{display:flex;gap:6px}
.bigm-score span{background:#fff;color:#000;font-weight:900;font-variation-settings:"wdth" 70;font-size:clamp(2.6rem,9vw,4.4rem);line-height:1;padding:10px 16px;border-radius:6px;min-width:1.3em;text-align:center;font-variant-numeric:tabular-nums}
.bigm-vs{font-weight:900;font-size:2.4rem;color:var(--gold);font-variation-settings:"wdth" 65}
.bigm-pen{color:var(--gold2);font-weight:800;text-transform:uppercase;letter-spacing:.05em;font-size:.85rem}
.bigm-st{color:var(--muted);text-transform:uppercase;letter-spacing:.08em;font-size:.72rem;font-weight:700}
@media (max-width:560px){.badge.xxl{width:72px;height:72px}.bigm-main{gap:8px}}
.status{color:var(--muted)}
</style>
</head>

  </div>
  <main id="main"><p class="muted" style="padding:30px 0">Cargando…</p></main>

const $ = s => document.querySelector(s);

/* ---------- data helpers ---------- */
const club = id => state.clubs.find(c => c.id === id);
const player = id => state.players.find(p => p.id === id);
const cup = id => state.cups.find(c => c.id === id);

const clubOf = (ed, pid) => club(partOf(ed, pid)?.clubId);

function badge(c, size){
  const cls = size ? " " + size : "";
  if(!c) return `<span class="badge${cls}"></span>`;
  const src = c.logo || LOGOS[c.id];
  if(src) return `<span class="badge img${cls}"><img src="${esc(src)}" alt="${esc(c.name)}"></span>`;
  return `<span class="badge${cls}" style="background:linear-gradient(135deg,${c.c1} 50%,${c.c2} 50%);color:${textOn(c.c1)}" aria-label="${esc(c.name)}">${esc(c.short)}</span>`;
}
function textOn(hex){
  const h = hex.replace("#",""); const r=parseInt(h.slice(0,2),16),g=parseInt(h.slice(2,4),16),b=parseInt(h.slice(4,6),16);
  return (r*299+g*587+b*114)/1000 > 150 ? "#111" : "#fff";
}
function who(ed, pid, sub = true){
  const p = player(pid), c = clubOf(ed, pid);
  return `<a class="who" href="#j-${pid}">${badge(c)}<div><b>${esc(p?.name || "—")}</b>${sub?`<small>${esc(c?.name || "")}</small>`:""}</div></a>`;
}

const isKO = m => m.stage !== "liga";
function played(m){
  if(m.home == null || m.away == null || m.hg == null || m.ag == null) return false;
  if(!isKO(m) || m.hg !== m.ag) return true;
  return m.ph != null && m.pa != null && m.ph !== m.pa;
}
function winner(m){ if(!played(m)) return null; if(m.hg!==m.ag) return m.hg>m.ag?m.home:m.away; return m.ph>m.pa?m.home:m.away; }
function loser(m){ const w = winner(m); return w == null ? null : (w === m.home ? m.away : m.home); }
const ko = (ed, id) => ed.matches.find(m => m.id === id);
const STAGE = {liga:"Liga", qf:"Cuartos", sf:"Semifinal", tp:"Tercer puesto", fin:"Final"};
const STAGE_ORDER = {liga:0, qf:1, sf:2, tp:3, fin:4};
const isGroups = ed => ed.format === "grupos4";
const GROUPS = ["A","B","C","D"];
const groupsOf = ed => isGroups(ed) ? GROUPS : [null];
const QF = ["qf1","qf2","qf3","qf4"];
const orderedMatches = ed => [...ed.matches].sort((a,b) => (STAGE_ORDER[a.stage]-STAGE_ORDER[b.stage]) || ((a.round||0)-(b.round||0)));

function standings(ed, g = null){
  const rows = {};
  ed.participants.filter(p => g == null || p.group === g).forEach(p => rows[p.playerId] = {pid:p.playerId,pj:0,g:0,e:0,p:0,gf:0,gc:0,pts:0});
  ed.matches.filter(m => m.stage === "liga" && played(m) && (g == null || m.group === g)).forEach(m => {
    const h = rows[m.home], a = rows[m.away]; if(!h || !a) return;
    h.pj++; a.pj++; h.gf+=m.hg; h.gc+=m.ag; a.gf+=m.ag; a.gc+=m.hg;
    if(m.hg>m.ag){h.g++;a.p++;h.pts+=3} else if(m.hg<m.ag){a.g++;h.p++;a.pts+=3} else {h.e++;a.e++;h.pts++;a.pts++}
  });
  return Object.values(rows).sort((x,y) => y.pts-x.pts || (y.gf-y.gc)-(x.gf-x.gc) || y.gf-x.gf || (player(x.pid)?.name||"").localeCompare(player(y.pid)?.name||""));
}
const ligaTotal = ed => groupsOf(ed).reduce((s, g) => { const n = ed.participants.filter(p => g == null || p.group === g).length; return s + n*(n-1)/2; }, 0) * (ed.legs || 1);
function groupPos(ed, pid){

const ligaDone = ed => { const l = ed.matches.filter(m => m.stage === "liga"); return l.length >= ligaTotal(ed) && l.every(played); };

function roundRobin(ids, legs, group = null){
  const a = [...ids]; if(a.length % 2) a.push(null);

  let arr = a;
  for(let r=0; r<n-1; r++){
    for(let i=0; i<n/2; i++){
      const x = arr[i], y = arr[n-1-i];
      if(x && y) out.push({id:uid(),stage:"liga",round:r+1,home:(r+i)%2?y:x,away:(r+i)%2?x:y,hg:null,ag:null});
    }
    arr = [arr[0], arr[n-1], ...arr.slice(1,n-1)];
  }
  if(legs === 2){
    const k = n-1;
    out.slice().forEach(m => out.push({id:uid(),stage:"liga",round:m.round+k,home:m.away,away:m.home,hg:null,ag:null}));

function setPair(m, h, a){ if(m && !played(m)){ m.home = h; m.away = a; } }

    const P = (g,i) => T[g][i]?.pid ?? null;
    setPair(q[0],P("A",0),P("B",1)); setPair(q[1],P("B",0),P("A",1)); setPair(q[2],P("C",0),P("D",1)); setPair(q[3],P("D",0),P("C",1));
  } else q.forEach(m => setPair(m,null,null));

  if(played(q[0]) && played(q[2])) setPair(s1,winner(q[0]),winner(q[2])); else setPair(s1,null,null);
  if(played(q[1]) && played(q[3])) setPair(s2,winner(q[1]),winner(q[3])); else setPair(s2,null,null);

}
function finals(ed){
  const s1 = ko(ed,"sf1"), s2 = ko(ed,"sf2"), fin = ko(ed,"fin"), tp = ko(ed,"tp");

function normalize(ed){
  if(isGroups(ed)) return normalizeGroups(ed);
  const s1 = ko(ed,"sf1"), s2 = ko(ed,"sf2"), fin = ko(ed,"fin"), tp = ko(ed,"tp");
  if(ligaDone(ed)){
    const t = standings(ed);
    const alt = ed.semis === "1-3";
    if(!played(s1)){ s1.home=t[0].pid; s1.away=t[alt?2:3].pid; }
    if(!played(s2)){ s2.home=t[1].pid; s2.away=t[alt?3:2].pid; }
  } else {
    [s1,s2].forEach(m => { if(!played(m)){ m.home=null; m.away=null; } });
  }
  if(played(s1) && played(s2)){
    if(!played(fin)){ fin.home=winner(s1); fin.away=winner(s2); }
    if(!played(tp)){ tp.home=loser(s1); tp.away=loser(s2); }

/* ---------- persistence ---------- */
let saveTimer = null, saving = false, pendingSave = false, dirtyUntil = 0, dirty = false, retries = 0;
const isDirty = () => dirty || saving || saveTimer || Date.now() < dirtyUntil;
function queueSave(){ dirty = true; clearTimeout(saveTimer); saveTimer = setTimeout(doSave, 400); setStatus("Guardando…"); }
async function doSave(){
  saveTimer = null;
  if(saving){ pendingSave = true; return; }
  saving = true; dirty = false;
  try{
    const data = JSON.parse(JSON.stringify(state));
    if(mode === "db") await Promise.race([docRef.set(data), new Promise((_, rej) => setTimeout(() => rej({code:"timeout"}), 8000))]);
    else { try{ localStorage.setItem(LS_KEY, JSON.stringify(data)); }catch(e){} }
    setStatus(mode === "db" ? "Guardado" : "Guardado en este navegador");
    retries = 0;
  }catch(e){
    const code = e?.code || "error";
    if(code !== "invalid_argument" && retries < 5){ retries++; setStatus(`No se pudo guardar (${code}). Reintentando…`); setTimeout(queueSave, 2000); }
    else setStatus(`No se pudo guardar (${code}). Recargá la página y probá de nuevo.`);
  }finally{
    saving = false;
    dirtyUntil = Date.now() + 2500;
    if(pendingSave){ pendingSave = false; doSave(); }
  }
}
function setStatus(t){ $("#status").textContent = t; }
function commit(){ state.cups.forEach(c => c.editions.forEach(normalize)); queueSave(); render(); }

function migrate(s){
  s.players ||= []; s.clubs ||= []; s.cups ||= []; s.news ||= [];
  if(s.editions){ if(s.editions.length || !s.cups.length) s.cups.unshift({id:"vashe", name:"Copa Vashe", format:"liga5", editions:s.editions}); delete s.editions; }
  if(!s.cups.length) s.cups.push({id:"vashe", name:"Copa Vashe", format:"liga5", editions:[]});
  CLUBS_DEFAULT.forEach(d => { if(!s.clubs.find(c => c.id === d.id)) s.clubs.push({...d}); });
  s.v = 2;
  return s;
}
function loadLocal(){ try{ const raw = localStorage.getItem(LS_KEY); if(raw) state = migrate(JSON.parse(raw)); }catch(e){} }

async function init(){
  window.addEventListener("hashchange", () => { render(); window.scrollTo(0,0); });
  if(!window.claude?.use){ mode = "local"; loadLocal(); render(); return; }
  const timer = setTimeout(() => { if(mode === "loading"){ mode = "local"; loadLocal(); render(); setStatus("No se pudo conectar: los datos se guardan solo en este navegador."); } }, 10000);
  try{ db = await window.claude.use("db"); }catch(e){ db = null; }
  try{ assets = await window.claude.use("assets"); }catch(e){ assets = null; }
  if(!db){ clearTimeout(timer); mode = "local"; loadLocal(); render(); setStatus("Guardado solo en este navegador."); return; }
  docRef = db.doc("copa/estado");
  docRef.onSnapshot(snap => {
    if(snap.metadata.hasPendingWrites) return;
    if(!snap.metadata.fromCache) clearTimeout(timer);
    if(mode !== "loading" && isDirty()) return;
    if(snap.exists) state = migrate(JSON.parse(JSON.stringify(snap.data())));
    if(mode === "loading"){ mode = "db"; render(); } else safeRender();
  }, () => { clearTimeout(timer); if(mode === "loading"){ loadLocal(); } mode = "local"; render(); setStatus("Sin conexión con la base: guardando en este navegador."); });
}
function safeRender(){
  const a = document.activeElement;
  if(a && (a.tagName === "INPUT" || a.tagName === "SELECT") && $("#main").contains(a)){ a.addEventListener("blur", () => setTimeout(render, 0), {once:true}); return; }
  render();
}

/* ---------- routing ---------- */
function route(){
  const h = location.hash.slice(1);

  m = h.match(/^c-([a-z0-9]+)(?:-([a-z]+))?$/);
  if(m && cup(m[1])) return {page:"copa", id:m[1], tab:CUP_TABS.some(t => t[0] === m[2]) ? m[2] : "tabla"};
  const first = state.cups[0];

  <p class="note" style="margin-top:12px">Escribí los goles en el casillero de cada jugador. Si hay empate aparece al lado el casillero de penales.</p>`;

function aggregate(list){ /* list of {cup,ed} */
  const pal = {}, at = {}, clubT = {};
  const P = id => pal[id] ||= {pid:id,t:0,f:0,pod:0,ed:0};
  const A = id => at[id] ||= {pid:id,pj:0,g:0,e:0,p:0,gf:0,gc:0,pts:0};
  list.forEach(({ed}) => {
    ed.participants.forEach(x => P(x.playerId).ed++);
    const p = podium(ed);
    if(p.first){ P(p.first).t++; P(p.first).f++; const c = clubOf(ed,p.first); if(c) clubT[c.id]=(clubT[c.id]||0)+1; }
    if(p.second) P(p.second).f++;
    [p.first,p.second,p.third].forEach(x => { if(x) P(x).pod++; });
    ed.matches.filter(played).forEach(m => {
      const h = A(m.home), a = A(m.away);
      h.pj++; a.pj++; h.gf+=m.hg; h.gc+=m.ag; a.gf+=m.ag; a.gc+=m.hg;
      if(m.hg>m.ag){h.g++;a.p++;h.pts+=3} else if(m.hg<m.ag){a.g++;h.p++;a.pts+=3} else {h.e++;a.e++;h.pts++;a.pts++}
    });
  });
  return {pal, at, clubT};
}

  ${atR.map((r,i) => `<tr><td class="pos">${i+1}</td><td class="l">${nm(r.pid)}</td><td>${r.pj}</td><td>${r.g}</td><td>${r.e}</td><td>${r.p}</td><td>${r.gf}</td><td>${r.gc}</td><td>${sgn(r.gf-r.gc)}</td><td class="pts">${r.pts}</td></tr>`).join("")}</tbody></table></div></div>
  ${Object.keys(clubT).length ? `<div class="panel"><h2>Títulos por club</h2><div class="row" style="gap:18px">${Object.entries(clubT).sort((a,b)=>b[1]-a[1]).map(([id,n]) => `<div class="who">${badge(club(id))}<div><b>${esc(club(id)?.name)}</b><small>${n} ${n===1?"título":"títulos"}</small></div></div>`).join("")}</div></div>` : ""}

function vJugador(p){
  if(!p) return `<div class="panel empty"><h2>No existe ese jugador</h2><p>Puede que lo hayan borrado.</p><a class="btn" href="#jugadores">Ver jugadores</a></div>`;
  const pid = p.id;
  const {eds, pal, at} = playerSummary(pid);

  /* every played match, in order */
  const games = [];
  eds.forEach(({cup:c, ed}) => orderedMatches(ed).filter(m => played(m) && (m.home===pid || m.away===pid)).forEach(m => {
    const home = m.home === pid, gf = home?m.hg:m.ag, gc = home?m.ag:m.hg, rival = home?m.away:m.home;
    const w = winner(m) === pid;
    const res = gf>gc ? "W" : gf<gc ? "L" : (isKO(m) ? (w?"W":"L") : "D");
    games.push({c, ed, m, gf, gc, rival, res, pens: gf===gc && isKO(m)});
  }));

  const best = (arr, f) => arr.reduce((a,b) => (a==null || f(b) > f(a)) ? b : a, null);
  const bigWin = best(games.filter(g => g.gf>g.gc), g => (g.gf-g.gc)*100 + g.gf);
  const bigLoss = best(games.filter(g => g.gf<g.gc), g => (g.gc-g.gf)*100 + g.gc);
  const mostGoals = best(games, g => g.gf*100 + (g.gf-g.gc));
  const streak = f => { let best=0, cur=0; games.forEach(g => { cur = f(g) ? cur+1 : 0; best = Math.max(best,cur); }); return best; };
  const winStreak = streak(g => g.res==="W"), unbeaten = streak(g => g.res!=="L");
  const ligaBest = eds.reduce((a,{cup:c,ed}) => { const x = groupPos(ed,pid); const pts = x.r.pts; return (!a || pts > a.pts) ? {c,ed,pts,pos:(x.g?`${x.pos}º del grupo ${x.g}`:`${x.pos}º`)} : a; }, null);
  const gameTxt = g => `${g.gf}-${g.gc}${g.pens?` (pen. ${g.m.home===pid?g.m.ph:g.m.pa}-${g.m.home===pid?g.m.pa:g.m.ph})`:""} vs ${esc(player(g.rival)?.name)}`;
  const gameCtx = g => `${esc(edLabel(g.c,g.ed))} · ${STAGE[g.m.stage]}${g.m.round?` ${g.m.round}`:""}`;
  const rec = (k, g) => `<div class="rec"><div class="k">${k}</div>${g ? `<div class="v">${gameTxt(g)}</div><small>${gameCtx(g)}</small>` : `<div class="v muted">—</div>`}</div>`;

  /* clubs used */
  const cl = {};
  eds.forEach(({ed}) => { const cid = partOf(ed,pid).clubId; const o = cl[cid] ||= {cid, ed:0, t:0, pj:0, g:0, e:0, p:0, gf:0, gc:0}; o.ed++; if(podium(ed).first===pid) o.t++; });
  games.forEach(g => { const o = cl[partOf(g.ed,pid).clubId]; o.pj++; o.gf+=g.gf; o.gc+=g.gc; if(g.res==="W") o.g++; else if(g.res==="L") o.p++; else o.e++; });

  /* head to head */
  const h2h = {};
  games.forEach(g => { const o = h2h[g.rival] ||= {pid:g.rival,pj:0,g:0,e:0,p:0,gf:0,gc:0}; o.pj++; o.gf+=g.gf; o.gc+=g.gc; if(g.res==="W") o.g++; else if(g.res==="L") o.p++; else o.e++; });

  const pctW = at.pj ? Math.round(games.filter(g => g.res==="W").length / at.pj * 100) : 0;
  const last5 = games.slice(-5);

  const parts = eds.slice().reverse().map(({cup:c, ed}) => {
    const pos = finalPlace(ed,pid); const x = groupPos(ed,pid), r = x.r;
    return `<tr><td class="l"><a href="#c-${c.id}" class="crumb" style="color:var(--ink)"><b>${esc(c.name)}</b></a><br><small class="muted">${esc(ed.name)}</small></td>
      <td class="l"><div class="who" style="min-width:0">${badge(clubOf(ed,pid))}<span>${esc(clubOf(ed,pid)?.name)}</span></div></td>
      <td>${x.g ? `Gr. ${x.g} · ` : ""}${x.pos}º</td><td>${r.pts}</td><td>${r.gf}-${r.gc}</td>
      <td class="l"><span class="res${pos===1?" c":""}">${pos ? (pos===1?"🏆 ":"") + placeText(ed,pos) : "En juego"}</span></td></tr>`; }).join("");

  return `<header class="hero"><div style="display:flex;gap:16px;align-items:center"><div>${badge(club(p.clubId),"xl")}</div><div><a class="crumb" href="#jugadores">← Jugadores</a><h1 style="margin-top:6px">${esc(p.name)}</h1>
    <p>${pal.ed} ${pal.ed===1?"edición jugada":"ediciones jugadas"}${last5.length?` · Últimos: <span class="form">${last5.map(g => `<i class="${g.res}" title="${gameTxt(g)}">${{W:"V",D:"E",L:"D"}[g.res]}</i>`).join("")}</span>`:""}</p></div></div></header>

  <div class="stats" style="margin:18px 0 16px">
    <div class="stat gold"><div class="v">${pal.t}</div><div class="k">Títulos</div></div>
    <div class="stat"><div class="v">${pal.f}</div><div class="k">Finales</div></div>
    <div class="stat"><div class="v">${pal.pod}</div><div class="k">Podios</div></div>
    <div class="stat"><div class="v">${at.pj}</div><div class="k">Partidos</div></div>
    <div class="stat"><div class="v">${at.g}-${at.e}-${at.p}</div><div class="k">G-E-P</div></div>
    <div class="stat"><div class="v">${pctW}%</div><div class="k">Victorias</div></div>
    <div class="stat"><div class="v">${at.gf}</div><div class="k">Goles a favor</div></div>
    <div class="stat"><div class="v">${at.gc}</div><div class="k">Goles en contra</div></div>
    <div class="stat"><div class="v">${at.pj ? (at.gf/at.pj).toFixed(1) : "0"}</div><div class="k">Goles por partido</div></div>
  </div>

  <div class="panel"><h2>Récords</h2><div class="recs">
    ${rec("Mayor goleada a favor", bigWin)}
    ${rec("Peor derrota", bigLoss)}
    ${rec("Más goles en un partido", mostGoals)}
    <div class="rec"><div class="k">Racha de victorias</div><div class="v">${winStreak} seguidas</div><small>Invicto como máximo: ${unbeaten} partidos</small></div>
    <div class="rec"><div class="k">Mejor fase regular</div>${ligaBest ? `<div class="v">${ligaBest.pts} pts (${ligaBest.pos})</div><small>${esc(edLabel(ligaBest.c,ligaBest.ed))}</small>` : `<div class="v muted">—</div>`}</div>
  </div></div>

  <div class="panel"><h2>Participaciones</h2>${eds.length ? `<div class="scroll"><table class="t"><thead><tr><th class="l">Copa</th><th class="l">Club</th><th>Fase regular</th><th>Pts</th><th>Goles</th><th class="l">Resultado</th></tr></thead><tbody>${parts}</tbody></table></div>` : `<p class="muted">Todavía no jugó ninguna edición.</p>`}</div>

  <div class="panel"><h2>Clubes utilizados</h2>${Object.keys(cl).length ? `<div class="scroll"><table class="t"><thead><tr><th class="l">Club</th><th>Ediciones</th><th>Títulos</th><th>PJ</th><th>G</th><th>E</th><th>P</th><th>GF</th><th>GC</th></tr></thead><tbody>
    ${Object.values(cl).sort((a,b) => b.ed-a.ed || b.t-a.t).map(o => `<tr><td class="l"><div class="who" style="min-width:0">${badge(club(o.cid))}<b>${esc(club(o.cid)?.name)}</b></div></td><td>${o.ed}</td><td class="pts">${o.t}</td><td>${o.pj}</td><td>${o.g}</td><td>${o.e}</td><td>${o.p}</td><td>${o.gf}</td><td>${o.gc}</td></tr>`).join("")}</tbody></table></div>` : `<p class="muted">—</p>`}</div>

  <div class="panel"><h2>Contra cada rival</h2>${Object.keys(h2h).length ? `<div class="scroll"><table class="t"><thead><tr><th class="l">Rival</th><th>PJ</th><th>G</th><th>E</th><th>P</th><th>GF</th><th>GC</th></tr></thead><tbody>
    ${Object.values(h2h).sort((a,b) => b.pj-a.pj).map(o => `<tr><td class="l"><a class="who" href="#j-${o.pid}" style="min-width:0"><b>${esc(player(o.pid)?.name)}</b></a></td><td>${o.pj}</td><td>${o.g}</td><td>${o.e}</td><td>${o.p}</td><td>${o.gf}</td><td>${o.gc}</td></tr>`).join("")}</tbody></table></div>` : `<p class="muted">—</p>`}</div>

  <div class="panel"><h3>Editar jugador</h3><div class="row"><input type="text" id="eName" value="${esc(p.name)}" aria-label="Nombre" maxlength="30"><select id="eClub" aria-label="Club habitual">${clubOptions(p.clubId)}</select><button class="btn small" data-act="save-player">Guardar cambios</button>
    ${eds.length ? "" : `<button class="btn small danger" data-act="del-player">Borrar jugador</button>`}</div><p class="note" style="margin:8px 0 0">El club habitual es el que aparece por defecto al armar una edición.</p></div>`;
}

  const d0 = new Date(), today = `${d0.getFullYear()}-${String(d0.getMonth()+1).padStart(2,"0")}-${String(d0.getDate()).padStart(2,"0")}`;
  const form = `<div class="panel"><h3>Agregar noticia</h3>
    <div class="row" style="margin-bottom:10px"><input type="text" id="nTitle" placeholder="Título" maxlength="120" style="flex:1;min-width:220px"><input type="date" id="nDate" value="${today}" aria-label="Fecha"></div>
    <textarea id="nBody" placeholder="Escribí la noticia…" maxlength="3000"></textarea>
    <div class="err" id="nErr"></div>
    <div class="row" style="justify-content:flex-end"><button class="btn primary" data-act="add-news">Publicar noticia</button></div></div>`;
  return `<header class="hero"><div><h1>Noticias</h1><p>Lo último de las copas</p></div></header>
    <div style="margin-top:18px">${admin ? form : ""}</div>
    ${list.length ? `<div class="news">${list.map(n => `<article class="panel nw"><div class="d">${n.date ? fmtDate(n.date) : ""}</div><div class="t">${esc(n.title)}</div>${n.body ? `<div class="b">${esc(n.body)}</div>` : ""}${admin ? `<div class="row" style="justify-content:flex-end;margin-top:10px"><button class="btn small danger" data-act="del-news" data-id="${n.id}">Borrar</button></div>` : ""}</article>`).join("")}</div>` : `<div class="panel empty"><h2>Sin noticias todavía</h2><p>${admin ? "Escribí la primera arriba." : "Cuando haya novedades van a aparecer acá."}</p></div>`}`;
}
function bind(r){
  const M = $("#main");
  const on = (sel, ev, fn) => M.querySelectorAll(sel).forEach(el => el.addEventListener(ev, e => fn(el, e)));
  on('[data-act="new-cup"]', "click", openNewCup);
  on('[data-act="add-news"]', "click", () => {
    const t = $("#nTitle").value.trim(), b = $("#nBody").value.trim(), d = $("#nDate").value, err = $("#nErr");
    if(!t){ err.textContent = "Poné un título."; return; }
    (state.news ||= []).push({id:uid(), title:t, body:b, date:d || null, created:Date.now()}); commit();
  });
  on('[data-act="del-news"]', "click", b => {
    const n = (state.news || []).find(x => x.id === b.dataset.id); if(!n) return;
    askConfirm(`Vas a borrar la noticia "${n.title}".`, "Borrar noticia", () => { state.news = state.news.filter(x => x.id !== n.id); commit(); });
  });
  on('[data-act="del-cup-home"]', "click", b => {
    const c = cup(b.dataset.id); if(!c) return;
    const n = c.editions.length;
    askConfirm(`Vas a borrar ${c.name}${n ? ` con sus ${n} ${n===1?"edición":"ediciones"}` : ""}. No se puede deshacer.`, "Borrar copa", () => { state.cups = state.cups.filter(x => x.id !== c.id); commit(); });
  });
  if(r.page === "copa"){
    const c = cup(r.id);
    $("#edSel")?.addEventListener("change", e => { curEd[c.id] = e.target.value; render(); });
    on('[data-act="new-ed"]', "click", () => openNewEdition(c));
    const ed = c.editions.find(e => e.id === curEd[c.id]);
    on("[data-open]", "click", (el, e) => { if(e.target.closest(admin ? "input,a,button,select" : "a,button,select")) return; const m = ed?.matches.find(x => x.id === el.dataset.open); if(m) openMatch(c, ed, m); });
    on('[data-act="semis"]', "change", s => { if(ed){ ed.semis = s.value; commit(); } });
    on('[data-act="fix-toggle"]', "click", () => { fixEdit[ed.id] = !fixEdit[ed.id]; render(); });
    on('[data-act="fix-add"]', "click", () => {
      const round = parseInt($("#fxRound").value, 10), home = $("#fxHome").value, away = $("#fxAway").value, err = $("#fxErr");
      const liga = ed.matches.filter(m => m.stage === "liga");
      if(!(round >= 1)){ err.textContent = "Poné un número de fecha."; return; }
      if(home === away){ err.textContent = "El local y el visitante tienen que ser distintos."; return; }
      if(liga.length >= ligaTotal(ed)){ err.textContent = `Ya están los ${ligaTotal(ed)} partidos de la liga.`; return; }
      const pair = liga.filter(m => (m.home===home&&m.away===away)||(m.home===away&&m.away===home)).length;
      if(pair >= (ed.legs || 1)){ err.textContent = `${player(home)?.name} y ${player(away)?.name} ya se enfrentan ${ed.legs===2?"dos veces":"en otra fecha"}.`; return; }
      const grp = isGroups(ed) ? partOf(ed,home)?.group : null;
      if(isGroups(ed) && grp !== partOf(ed,away)?.group){ err.textContent = "Los dos tienen que ser del mismo grupo."; return; }
      if(liga.some(m => m.round === round && [m.home,m.away].some(x => x===home||x===away))){ err.textContent = "Uno de los dos ya juega en esa fecha."; return; }
      ed.matches.push({id:uid(), stage:"liga", group:grp, round, home, away, hg:null, ag:null});
      commit();
    });
    on("[data-del-m]", "click", b => { ed.matches = ed.matches.filter(m => m.id !== b.dataset.delM); commit(); });
    on("input[data-m]", "change", inp => {
      const m = ed?.matches.find(x => x.id === inp.dataset.m); if(!m) return;
      const val = inp.value.trim() === "" ? null : Math.max(0, Math.min(99, parseInt(inp.value,10)));
      m[inp.dataset.f] = Number.isFinite(val) ? val : null;
      if(isKO(m) && !(m.hg != null && m.ag != null && m.hg === m.ag)){ m.ph = null; m.pa = null; }
      commit();
    });
    on('[data-act="rename-cup"]', "click", () => { const n = $("#cupName").value.trim(); if(n){ c.name = n; commit(); } });
    on('[data-act="del-ed"]', "click", () => {
      const id = $("#delEdSel").value; const e = c.editions.find(x => x.id === id);
      if(e) askConfirm(`Vas a borrar la ${e.name} y todos sus resultados.`, "Borrar edición", () => { c.editions = c.editions.filter(x => x.id !== id); commit(); });
    });
    on('[data-act="del-cup"]', "click", () => {
      askConfirm(`Vas a borrar ${c.name} con todas sus ediciones. No se puede deshacer.`, "Borrar copa", () => { state.cups = state.cups.filter(x => x.id !== c.id); location.hash = "inicio"; commit(); });
    });
  }
  on('[data-act="add-player"]', "click", () => {
    const n = $("#pName").value.trim(); if(!n){ $("#pName").focus(); return; }
    state.players.push({id:uid(), name:n, clubId:$("#pClub").value}); commit();
  });
  if(r.page === "jugador"){
    const p = player(r.id);
    on('[data-act="save-player"]', "click", () => { const n = $("#eName").value.trim(); if(n) p.name = n; p.clubId = $("#eClub").value; commit(); });
    on('[data-act="del-player"]', "click", () => { askConfirm(`Vas a borrar a ${p.name}.`, "Borrar jugador", () => { state.players = state.players.filter(x => x.id !== p.id); location.hash = "jugadores"; commit(); }); });
  }
  on("[data-logo]", "change", async inp => {
    const f = inp.files[0]; if(!f || !assets) return;
    setStatus("Subiendo escudo…");
    try{ const res = await assets.upload(f); club(inp.dataset.logo).logo = res.url; commit(); }
    catch(e){ setStatus("No se pudo subir el escudo. Probá con una imagen más liviana."); }
  });
  on('[data-act="rm-logo"]', "click", b => { const c = club(b.dataset.id); if(c){ c.logo = null; commit(); } });
}

/* ---------- dialogs ---------- */
function openMatch(c, ed, m){
  const dlg = $("#dlg"), body = $("#dlgBody"), done = played(m), w = (isKO(m) || m.hg !== m.ag) ? winner(m) : null;
  const where = m.stage === "liga" ? `${m.group ? `Grupo ${m.group} · ` : ""}Fecha ${m.round}` : m.stage === "qf" ? "Cuartos de final" : STAGE[m.stage];
  const side = pid => { const cl = clubOf(ed,pid); return `<div class="bigm-side${w ? (w===pid ? " won" : " lost") : ""}">${badge(cl,"xxl")}<a class="bigm-nm" href="#j-${pid}">${esc(player(pid)?.name)}</a><div class="bigm-cl">${esc(cl?.name || "")}</div></div>`; };
  const score = m.hg != null && m.ag != null ? `<div class="bigm-score"><span>${m.hg}</span><span>${m.ag}</span></div>` : `<div class="bigm-vs">VS</div>`;
  const pens = isKO(m) && m.hg != null && m.hg === m.ag && m.ph != null && m.pa != null ? `<div class="bigm-pen">Penales ${m.ph} – ${m.pa}</div>` : "";
  dlg.classList.add("wide");
  body.innerHTML = `<div class="bigm"><div class="bigm-h"><span>${esc(c.name)} · ${esc(ed.name)}</span><span>${where}</span></div>
    <div class="bigm-main">${side(m.home)}<div class="bigm-mid">${score}${pens}<div class="bigm-st">${done ? "Final" : m.hg != null && m.ag != null ? "Faltan penales" : "Por jugar"}</div></div>${side(m.away)}</div>
    <div class="row" style="justify-content:center"><button class="btn" id="bmClose">Cerrar</button></div></div>`;
  $("#bmClose").onclick = () => dlg.close();
  body.querySelectorAll("a").forEach(a => a.addEventListener("click", () => dlg.close()));
  dlg.addEventListener("close", () => dlg.classList.remove("wide"), {once:true});
  dlg.showModal(); $("#bmClose").focus();
}
function askConfirm(msg, okLabel, onOk){
  const dlg = $("#dlg"), body = $("#dlgBody");
  body.innerHTML = `<h2>¿Seguro?</h2><p style="margin:0">${esc(msg)}</p>
    <div class="row" style="justify-content:flex-end"><button class="btn" id="cfNo">Cancelar</button><button class="btn primary" id="cfYes" style="background:var(--loss);border-color:var(--loss);color:#fff">${esc(okLabel)}</button></div>`;
  $("#cfNo").onclick = () => dlg.close();
  $("#cfYes").onclick = () => { dlg.close(); onOk(); };
  dlg.showModal(); $("#cfNo").focus();
}
function openNewCup(){
  const dlg = $("#dlg"), body = $("#dlgBody");
  body.innerHTML = `<h2>Nueva copa</h2>
    <label>Nombre<input type="text" id="cName" placeholder="Copa …" maxlength="40"></label>
    <label>Formato<select id="cFmt">${Object.entries(FORMATS).map(([k,v]) => `<option value="${k}">${esc(v)}</option>`).join("")}</select></label>
    <div class="err" id="cErr"></div>
    <div class="row" style="justify-content:flex-end"><button class="btn" id="cCancel">Cancelar</button><button class="btn primary" id="cCreate">Crear copa</button></div>`;
  $("#cCancel").onclick = () => dlg.close();
  $("#cCreate").onclick = () => {
    const n = $("#cName").value.trim(); if(!n){ $("#cErr").textContent = "Poné un nombre para la copa."; return; }
    const c = {id:uid(), name:n, format:$("#cFmt").value, editions:[]};
    state.cups.push(c); dlg.close(); location.hash = `c-${c.id}`; commit();
  };
  dlg.showModal(); $("#cName").focus();
}

function openNewEdition(c){
  const n = c.editions.length + 1, G = c.format === "grupos4", N = G ? 16 : 6, base = G ? 24 : 15;
  const dlg = $("#dlg"), body = $("#dlgBody");
  const gOpts = sel => `<option value="">—</option>` + GROUPS.map(g => `<option value="${g}"${g===sel?" selected":""}>Grupo ${g}</option>`).join("");
  const draw = () => {
    body.innerHTML = `<h2>Nueva edición · ${esc(c.name)}</h2>
    <label>Nombre<input type="text" id="edName" value="${ord(n)} edición" maxlength="40"></label>
    <label>Fecha<input type="date" id="edDate"></label>
    <div><b style="font-size:.9rem">${G ? "Fase de grupos" : "Liga"}</b><div class="seg"><label><input type="radio" name="legs" value="1" checked> Una vuelta (${base} partidos)</label><label><input type="radio" name="legs" value="2"> Ida y vuelta (${base*2})</label></div></div>
    <div><b style="font-size:.9rem">Fixture</b><div class="seg"><label><input type="radio" name="fix" value="auto" checked> Automático</label><label><input type="radio" name="fix" value="manual"> Lo armo yo</label></div></div>
    <div><b style="font-size:.9rem">Elegí los ${N} jugadores${G ? ", su grupo" : ""} y su club</b> <span class="muted" id="selCount" style="font-size:.85rem"></span>
      ${G ? `<div class="row" style="margin-top:6px"><button class="btn small" id="drawG">Sortear grupos</button><small class="muted">Reparte al azar a los marcados, 4 por grupo.</small></div>` : ""}
      ${state.players.length ? `<div class="pick${G?" g":""}" style="margin-top:8px">${state.players.map(p => `<input type="checkbox" data-sel="${p.id}" aria-label="Elegir ${esc(p.name)}"><span>${esc(p.name)}</span>${G ? `<select data-grp="${p.id}" aria-label="Grupo de ${esc(p.name)}">${gOpts("")}</select>` : ""}<select data-club="${p.id}" aria-label="Club de ${esc(p.name)}">${clubOptions(p.clubId)}</select>`).join("")}</div>` : `<p class="muted">Todavía no hay jugadores.</p>`}
      <div class="row" style="margin-top:10px"><input type="text" id="qName" placeholder="Agregar jugador nuevo" maxlength="30"><button class="btn small" id="qAdd">Agregar</button></div>
    </div>
    <div class="err" id="edErr"></div>
    <div class="row" style="justify-content:flex-end"><button class="btn" id="edCancel">Cancelar</button><button class="btn primary" id="edCreate">Crear edición</button></div>`;
    $("#qAdd").onclick = () => { const v = $("#qName").value.trim(); if(!v) return; const keep = snapshot(); state.players.push({id:uid(),name:v,clubId:"rma"}); queueSave(); draw(); restore(keep); };
    $("#edCancel").onclick = () => dlg.close();
    $("#edCreate").onclick = create;
    const count = () => { $("#selCount").textContent = `(${body.querySelectorAll("[data-sel]:checked").length} de ${N})`; };
    body.querySelectorAll("[data-sel]").forEach(x => x.addEventListener("change", count)); count();
    body.querySelectorAll("[data-grp]").forEach(s => s.addEventListener("change", () => { if(s.value){ const x = body.querySelector(`[data-sel="${s.dataset.grp}"]`); x.checked = true; count(); } }));
    if(G) $("#drawG").onclick = () => {
      const ids = [...body.querySelectorAll("[data-sel]:checked")].map(x => x.dataset.sel);
      if(ids.length !== 16){ $("#edErr").textContent = `Para sortear marcá 16 jugadores (marcaste ${ids.length}).`; return; }
      for(let i = ids.length - 1; i > 0; i--){ const j = Math.floor(Math.random() * (i + 1)); [ids[i], ids[j]] = [ids[j], ids[i]]; }
      ids.forEach((id, i) => body.querySelector(`[data-grp="${id}"]`).value = GROUPS[Math.floor(i / 4)]);
      $("#edErr").textContent = "";
    };
  };
  const snapshot = () => ({name:$("#edName").value, date:$("#edDate").value, legs:body.querySelector('input[name=legs]:checked').value, fix:body.querySelector('input[name=fix]:checked').value,
    sel:[...body.querySelectorAll("[data-sel]")].filter(x=>x.checked).map(x=>x.dataset.sel),
    clubs:Object.fromEntries([...body.querySelectorAll("[data-club]")].map(s=>[s.dataset.club,s.value])),
    grps:Object.fromEntries([...body.querySelectorAll("[data-grp]")].map(s=>[s.dataset.grp,s.value]))});
  const restore = k => { $("#edName").value=k.name; $("#edDate").value=k.date; body.querySelector(`input[name=legs][value="${k.legs}"]`).checked=true; body.querySelector(`input[name=fix][value="${k.fix}"]`).checked=true;
    k.sel.forEach(id => { const x = body.querySelector(`[data-sel="${id}"]`); if(x) x.checked = true; });
    Object.entries(k.clubs).forEach(([id,v]) => { const s = body.querySelector(`[data-club="${id}"]`); if(s) s.value = v; });
    Object.entries(k.grps).forEach(([id,v]) => { const s = body.querySelector(`[data-grp="${id}"]`); if(s) s.value = v; });
    $("#selCount").textContent = `(${k.sel.length} de ${N})`; };
  const create = () => {
    const k = snapshot();
    if(k.sel.length !== N){ $("#edErr").textContent = `Tenés que elegir exactamente ${N} jugadores (elegiste ${k.sel.length}).`; return; }
    if(G){
      const bad = GROUPS.find(g => k.sel.filter(id => k.grps[id] === g).length !== 4);
      if(k.sel.some(id => !k.grps[id])){ $("#edErr").textContent = "A todos los elegidos asignales un grupo (o tocá Sortear grupos)."; return; }
      if(bad){ $("#edErr").textContent = `Cada grupo tiene que tener 4 jugadores. Revisá el grupo ${bad}.`; return; }
    }
    if(!k.name.trim()){ $("#edErr").textContent = "Poné un nombre para la edición."; return; }
    const legs = +k.legs;
    const blank = id => ({id,stage:id.startsWith("sf")?"sf":id.startsWith("qf")?"qf":id,home:null,away:null,hg:null,ag:null,ph:null,pa:null});
    const liga = k.fix !== "auto" ? [] : G ? GROUPS.flatMap(g => roundRobin(k.sel.filter(id => k.grps[id] === g), legs, g)) : roundRobin(k.sel, legs);
    const ed = {id:uid(), num:n, format:c.format, name:k.name.trim(), date:k.date||null, legs,
      participants:k.sel.map(id => G ? {playerId:id, clubId:k.clubs[id], group:k.grps[id]} : {playerId:id, clubId:k.clubs[id]}),
      matches:[...liga, ...(G ? QF.map(blank) : []), blank("sf1"), blank("sf2"), blank("tp"), blank("fin")]};
    c.editions.push(ed); curEd[c.id] = ed.id; dlg.close();
    location.hash = `c-${c.id}-partidos`;
    commit();
  };
  draw(); dlg.showModal();
}

init();
</script>
</body>
</html>
